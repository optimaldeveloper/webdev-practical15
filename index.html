<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Chart Deployment</title>
    <!-- Using Chart.js for dynamic charting -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 50px; }
        .chart-container { width: 60%; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h2>Student Enrollment Data (2026)</h2>
    <div class="chart-container">
        <canvas id="enrollmentChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('enrollmentChart');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Computer Science', 'Data Science', 'Information Tech', 'Electronics'],
                datasets: [{
                    label: 'Number of Students Enrolled',
                    data: [120, 95, 110, 80],
                    backgroundColor: 'rgba(54, 162, 235, 0.6)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    </script>
</body>
</html>
